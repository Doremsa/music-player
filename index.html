<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player Widget</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <audio id="audio" src="song.mp3"></audio>

    <div class="player-card">
      <div class="player-cover"><img src="cover.png"></img></div>

      <div class="player-info">
        <h3>California Love</h3>
        <p>2Pac, Roger, Dr. Dre</p>
      </div>

      <div class="player-controls">
        <button id="btn-play" class="spotify-btn">
            <svg class="icon-play" viewBox="0 0 24 24" width="24" height="24">
                <path fill="currentColor" d="M7 6v12l10-6z"/>
            </svg>

            <svg class="icon-pause" viewBox="0 0 24 24" width="24" height="24" style="display: none;">
                <path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
        </button>
      </div>

      <div class="player-timeline">
        <span id="time-current" class="time-current">0:00</span>
        <input type="range" id="progress-bar" class="progress-bar" min="0" value="0">
        <span id="time-total" class="time-total">4:44</span>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
